---
- name: Register system with Red Hat
  community.general.redhat_subscription:
    org_id: "{{ rhsm_org_id }}"
    activationkey: "{{ rhsm_activation_key }}"
    state: present

- name: Set release version for EUS repos
  ansible.builtin.command:
    cmd: subscription-manager release --set=9.6
  changed_when: true

- name: Enable RHSM repository management (disabled by default on RHEL 9 Cloud Access AMIs)
  ansible.builtin.lineinfile:
    path: /etc/rhsm/rhsm.conf
    regexp: '^manage_repos\s*='
    line: 'manage_repos = 1'


- name: Disable all repos and enable Satellite 6.19 repos
  community.general.rhsm_repository:
    name: "{{ satellite_repos }}"
    state: enabled
    purge: true

- name: Install prerequisite packages
  ansible.builtin.dnf:
    name:
      - satellite
      - firewalld
    state: present

- name: Format data volume for /var/lib/pulp
  community.general.filesystem:
    fstype: xfs
    dev: "{{ satellite_data_device }}"

- name: Create mount point for Pulp data
  ansible.builtin.file:
    path: "{{ satellite_data_mount }}"
    state: directory
    mode: "0755"

- name: Mount Pulp data volume
  ansible.posix.mount:
    path: "{{ satellite_data_mount }}"
    src: "{{ satellite_data_device }}"
    fstype: xfs
    state: mounted

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ satellite_hostname }}"

- name: Add hostname to /etc/hosts for loopback resolution
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '.*{{ satellite_hostname }}$'
    line: "{{ ansible_default_ipv4.address }} {{ satellite_hostname }}"
    state: present

- name: Start and enable firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Open firewall ports for Satellite
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - 443/tcp
    - 5647/tcp
    - 8000/tcp
    - 8140/tcp
    - 9090/tcp
    - 80/tcp

- name: Copy subscription manifest to Satellite host
  ansible.builtin.copy:
    src: "{{ satellite_manifest_path }}"
    dest: /root/manifest.zip
    mode: "0600"
  when: satellite_manifest_path is defined

- name: Run Satellite installer
  ansible.builtin.include_role:
    name: redhat.satellite_operations.installer
  vars:
    satellite_installer_scenario: satellite
    satellite_installer_options:
      - '--foreman-initial-admin-username "{{ satellite_admin_user }}"'
      - '--foreman-initial-admin-password "{{ satellite_admin_password }}"'
      - '--foreman-initial-organization "{{ satellite_organization }}"'
      - '--foreman-initial-location "{{ satellite_location }}"'
      - '--enable-foreman-plugin-remote-execution'
      - '--enable-foreman-proxy-plugin-remote-execution-script'

- name: Wait for Satellite to be accessible
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}/api/v2/status"
    validate_certs: false
    user: "{{ satellite_admin_user }}"
    password: "{{ satellite_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: satellite_status
  retries: 30
  delay: 20
  until: satellite_status.status == 200

- name: Upload subscription manifest
  redhat.satellite.subscription_manifest:
    server_url: "https://{{ ansible_host }}"
    username: "{{ satellite_admin_user }}"
    password: "{{ satellite_admin_password }}"
    validate_certs: false
    organization: "{{ satellite_organization }}"
    manifest_path: /root/manifest.zip
    state: present
  when: satellite_manifest_path is defined