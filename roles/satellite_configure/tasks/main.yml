---
# satellite_configure role — connected Satellite only
# Enables and syncs repos that will be transferred to the disconnected
# Satellite via ISS Network Sync. Does NOT create Content Views,
# Lifecycle Environments, Activation Keys, or Host Groups for managed
# hosts — those belong on the disconnected Satellite (phase 05).

# --- RHEL 10 BaseOS + AppStream (ISS source for managed hosts) ---

- name: Enable RHEL 10 BaseOS repository
  redhat.satellite.repository_set:
    name: "Red Hat Enterprise Linux 10 for x86_64 - BaseOS (RPMs)"
    organization: "{{ satellite_organization }}"
    product: "Red Hat Enterprise Linux for x86_64"
    repositories:
      - releasever: "10"
    state: enabled

- name: Enable RHEL 10 AppStream repository
  redhat.satellite.repository_set:
    name: "Red Hat Enterprise Linux 10 for x86_64 - AppStream (RPMs)"
    organization: "{{ satellite_organization }}"
    product: "Red Hat Enterprise Linux for x86_64"
    repositories:
      - releasever: "10"
    state: enabled

- name: Set download policy to on_demand for BaseOS
  redhat.satellite.repository:
    name: "Red Hat Enterprise Linux 10 for x86_64 - BaseOS RPMs 10"
    product: "Red Hat Enterprise Linux for x86_64"
    organization: "{{ satellite_organization }}"
    download_policy: on_demand
    content_type: yum
    state: present

- name: Set download policy to on_demand for AppStream
  redhat.satellite.repository:
    name: "Red Hat Enterprise Linux 10 for x86_64 - AppStream RPMs 10"
    product: "Red Hat Enterprise Linux for x86_64"
    organization: "{{ satellite_organization }}"
    download_policy: on_demand
    content_type: yum
    state: present

# --- AAP 2.7 + RHEL 10 EUS (ISS source for AAP installation) ---

- name: Enable RHEL 10 EUS BaseOS repository
  redhat.satellite.repository_set:
    name: "Red Hat Enterprise Linux 10 for x86_64 - BaseOS - Extended Update Support (RPMs)"
    organization: "{{ satellite_organization }}"
    product: "Red Hat Enterprise Linux for x86_64 - Extended Update Support"
    repositories:
      - releasever: "10.2"
    state: enabled

- name: Enable RHEL 10 EUS AppStream repository
  redhat.satellite.repository_set:
    name: "Red Hat Enterprise Linux 10 for x86_64 - AppStream - Extended Update Support (RPMs)"
    organization: "{{ satellite_organization }}"
    product: "Red Hat Enterprise Linux for x86_64 - Extended Update Support"
    repositories:
      - releasever: "10.2"
    state: enabled

- name: Enable AAP 2.7 for RHEL 10 repository
  redhat.satellite.repository_set:
    name: "Red Hat Ansible Automation Platform 2.7 for RHEL 10 x86_64 (RPMs)"
    organization: "{{ satellite_organization }}"
    product: "Red Hat Ansible Automation Platform"
    all_repositories: true
    state: enabled

- name: Set download policy to on_demand for AAP/EUS repos
  redhat.satellite.repository:
    name: "{{ item.name }}"
    product: "{{ item.product }}"
    organization: "{{ satellite_organization }}"
    download_policy: on_demand
    content_type: yum
    state: present
  loop:
    - name: "Red Hat Enterprise Linux 10 for x86_64 - BaseOS - Extended Update Support RPMs 10.2"
      product: "Red Hat Enterprise Linux for x86_64 - Extended Update Support"
    - name: "Red Hat Enterprise Linux 10 for x86_64 - AppStream - Extended Update Support RPMs 10.2"
      product: "Red Hat Enterprise Linux for x86_64 - Extended Update Support"
    - name: "Red Hat Ansible Automation Platform 2.7 for RHEL 10 x86_64 RPMs"
      product: "Red Hat Ansible Automation Platform"

