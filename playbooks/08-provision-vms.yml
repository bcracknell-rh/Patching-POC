---
# Phase 8: Provision RHEL 10.2 VMs and register to disconnected Satellite
# Requires: 01-provision-networking.yml, 04-deploy-disconnected-satellite.yml
# Deploys 3 VMs into the disconnected subnet and registers
# them to the disconnected Satellite Server (not the connected upstream).
- name: Provision RHEL 10.2 VMs in disconnected subnet
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/aws.yml
    - vars/aws_resources.yml
    - vars/satellite_resources.yml
    - vars/disconnected_satellite_resources.yml
    - ../inventory/group_vars/all.yml
    - ../inventory/group_vars/disconnected_satellite.yml
    - ../credentials.yml

  vars:
    rhel10_ami_owner: "309956199498"
    rhel10_ami_filter: "RHEL-10.2*_HVM-*-x86_64-*-Access2-*"
    vm_instance_type: t3.medium
    vm_volume_size: 30

    patching_vms:
      - name: rhel10-dev
        environment: Dev
        activation_key: ak-rhel10-dev
      - name: rhel10-qa
        environment: QA
        activation_key: ak-rhel10-qa
      - name: rhel10-prod
        environment: Prod
        activation_key: ak-rhel10-prod

  tasks:
    - name: Create VM security group in disconnected subnet
      amazon.aws.ec2_security_group:
        name: patching-poc-vm-sg
        description: Security group for RHEL 10 patching VMs (disconnected)
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        rules: "{{ vm_security_group_rules }}"
        rules_egress:
          - proto: all
            cidr_ip: "{{ aws_vpc_cidr }}"
            rule_desc: Allow all traffic within VPC only
        tags: "{{ aws_tags }}"
        state: present
      register: vm_sg

    - name: Find latest RHEL 10.2 AMI
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners:
          - "{{ rhel10_ami_owner }}"
        filters:
          name: "{{ rhel10_ami_filter }}"
          architecture: x86_64
      register: rhel10_amis

    - name: Set latest RHEL 10.2 AMI fact
      ansible.builtin.set_fact:
        rhel10_ami_id: "{{ (rhel10_amis.images | sort(attribute='creation_date') | last).image_id }}"

    - name: Launch RHEL 10.2 VMs in disconnected subnet
      amazon.aws.ec2_instance:
        name: "patching-poc-{{ item.name }}"
        key_name: "{{ aws_key_name }}"
        instance_type: "{{ vm_instance_type }}"
        image_id: "{{ rhel10_ami_id }}"
        region: "{{ aws_region }}"
        vpc_subnet_id: "{{ disconnected_subnet_id }}"
        security_group: "{{ vm_sg.group_id }}"
        network:
          assign_public_ip: false
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: "{{ vm_volume_size }}"
              volume_type: gp3
              delete_on_termination: true
        tags: "{{ aws_tags | combine({'Name': 'patching-poc-' + item.name, 'Role': 'managed_host', 'Environment': item.environment}) }}"
        user_data: |
          #!/bin/bash
          hostnamectl set-hostname {{ item.name }}.{{ satellite_domain }}
        wait: true
        state: running
      loop: "{{ patching_vms }}"
      register: vm_instances

    - name: Wait for SSH on all VMs via upstream Satellite bastion
      ansible.builtin.wait_for:
        host: "{{ item.instances[0].private_ip_address }}"
        port: 22
        delay: 30
        timeout: 600
      delegate_to: "{{ satellite_public_ip }}"
      vars:
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "~/.ssh/{{ aws_key_name }}.pem"
      loop: "{{ vm_instances.results }}"

    - name: Add VM host entries to SSH config for disconnected subnet
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/.ssh_config_disconnected"
        line: |

          Host {{ item.instances[0].private_ip_address }}
            User ec2-user
            IdentityFile ~/.ssh/{{ aws_key_name }}.pem
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand ssh -i ~/.ssh/{{ aws_key_name }}.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ec2-user@{{ satellite_public_ip }}
        create: true
        mode: "0600"
      loop: "{{ vm_instances.results }}"

    - name: Add VMs to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.item.name }}"
        ansible_host: "{{ item.instances[0].private_ip_address }}"
        groups: patching_vms
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "~/.ssh/{{ aws_key_name }}.pem"
        ansible_ssh_common_args: "-F {{ playbook_dir }}/.ssh_config_disconnected -o ControlMaster=no"
        activation_key: "{{ item.item.activation_key }}"
        vm_environment: "{{ item.item.environment }}"
      loop: "{{ vm_instances.results }}"

- name: Register RHEL 10.2 VMs with disconnected Satellite
  hosts: patching_vms
  become: true

  vars_files:
    - vars/aws.yml
    - vars/satellite_resources.yml
    - vars/disconnected_satellite_resources.yml
    - ../inventory/group_vars/all.yml
    - ../inventory/group_vars/disconnected_satellite.yml

  vars:
    dsat_server_url: "https://{{ disconnected_satellite_private_ip }}"

  tasks:
    - name: Add disconnected Satellite to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '.*{{ disconnected_satellite_hostname }}$'
        line: "{{ disconnected_satellite_private_ip }} {{ disconnected_satellite_hostname }}"
        state: present

    - name: Download disconnected Satellite CA certificate RPM
      ansible.builtin.get_url:
        url: "https://{{ disconnected_satellite_private_ip }}/pub/katello-ca-consumer-latest.noarch.rpm"
        dest: /tmp/katello-ca-consumer-latest.noarch.rpm
        validate_certs: false
        mode: "0644"

    - name: Install disconnected Satellite CA certificate
      ansible.builtin.dnf:
        name: /tmp/katello-ca-consumer-latest.noarch.rpm
        state: present
        disable_gpg_check: true
        disablerepo: "*"

    - name: Register with disconnected Satellite using activation key
      community.general.redhat_subscription:
        server_hostname: "{{ disconnected_satellite_private_ip }}"
        org_id: "{{ disconnected_satellite_organization }}"
        activationkey: "{{ activation_key }}"
        state: present

    - name: Install katello-host-tools for errata reporting
      ansible.builtin.dnf:
        name:
          - katello-host-tools
          - katello-host-tools-tracer
        state: present

    - name: Enable and start remote execution (SSH)
      ansible.builtin.authorized_key:
        user: root
        state: present
        key: "{{ lookup('url', dsat_server_url + '/ssh/pubkey', validate_certs=false) }}"

    - name: Run initial package profile upload
      ansible.builtin.command:
        cmd: katello-package-upload
      changed_when: true
