---
# Phase 1: Deploy AAP 2.7 Controller on AWS EC2
# Run from local desktop: ansible-playbook playbooks/01-deploy-aap.yml
- name: Deploy AAP 2.7 Controller in AWS
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/aws.yml
    - ../inventory/group_vars/all.yml
    - ../inventory/group_vars/aap.yml
    - ../credentials.yml

  tasks:
    # --- Networking: create new or use existing ---
    - name: Create VPC for Patching POC
      amazon.aws.ec2_vpc_net:
        name: patching-poc-vpc
        cidr_block: "{{ aws_vpc_cidr }}"
        region: "{{ aws_region }}"
        tags: "{{ aws_tags }}"
        state: present
      register: vpc
      when: existing_vpc_id | default("") | length == 0

    - name: Set VPC ID fact
      ansible.builtin.set_fact:
        vpc_id: "{{ existing_vpc_id if (existing_vpc_id | default('') | length > 0) else vpc.vpc.id }}"

    - name: Create Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        tags: "{{ aws_tags | combine({'Name': 'patching-poc-igw'}) }}"
        state: present
      register: igw
      when: existing_vpc_id | default("") | length == 0

    - name: Create subnet
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc_id }}"
        cidr: "{{ aws_subnet_cidr }}"
        az: "{{ aws_availability_zone }}"
        region: "{{ aws_region }}"
        map_public: true
        tags: "{{ aws_tags | combine({'Name': 'patching-poc-subnet'}) }}"
        state: present
      register: subnet
      when: existing_subnet_id | default("") | length == 0

    - name: Set subnet ID fact
      ansible.builtin.set_fact:
        subnet_id: "{{ existing_subnet_id if (existing_subnet_id | default('') | length > 0) else subnet.subnet.id }}"

    - name: Create route table with IGW route
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        subnets:
          - "{{ subnet_id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw.gateway_id }}"
        tags: "{{ aws_tags | combine({'Name': 'patching-poc-rt'}) }}"
        state: present
      when: existing_vpc_id | default("") | length == 0

    # --- Security group and EC2 (always run) ---
    - name: Create AAP security group
      amazon.aws.ec2_security_group:
        name: patching-poc-aap-sg
        description: Security group for AAP Controller
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        rules: "{{ aap_security_group_rules }}"
        tags: "{{ aws_tags }}"
        state: present
      register: aap_sg

    - name: Find latest RHEL 10.2 AMI for AAP
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners:
          - "{{ aap_ami_owner }}"
        filters:
          name: "{{ aap_ami_filter }}"
          architecture: x86_64
      register: aap_amis

    - name: Set latest RHEL 10.2 AMI fact
      ansible.builtin.set_fact:
        aap_ami_id: "{{ (aap_amis.images | sort(attribute='creation_date') | last).image_id }}"

    - name: Launch AAP Controller EC2 instance
      amazon.aws.ec2_instance:
        name: patching-poc-aap
        key_name: "{{ aws_key_name }}"
        instance_type: "{{ aap_instance_type }}"
        image_id: "{{ aap_ami_id }}"
        region: "{{ aws_region }}"
        vpc_subnet_id: "{{ subnet_id }}"
        security_group: "{{ aap_sg.group_id }}"
        network:
          assign_public_ip: true
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: "{{ aap_root_volume_size }}"
              volume_type: gp3
              delete_on_termination: true
        tags: "{{ aws_tags | combine({'Name': 'patching-poc-aap', 'Role': 'aap', 'Environment': 'management'}) }}"
        wait: true
        state: running
      register: aap_instance

    - name: Wait for SSH to be available
      ansible.builtin.wait_for:
        host: "{{ aap_instance.instances[0].public_ip_address }}"
        port: 22
        delay: 30
        timeout: 300

    - name: Add AAP host to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ aap_instance.instances[0].public_ip_address }}"
        groups: aap
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "~/.ssh/{{ aws_key_name }}.pem"

    - name: Save VPC and subnet IDs for later phases
      ansible.builtin.copy:
        content: |
          ---
          vpc_id: "{{ vpc_id }}"
          subnet_id: "{{ subnet_id }}"
          aap_instance_id: "{{ aap_instance.instances[0].instance_id }}"
          aap_public_ip: "{{ aap_instance.instances[0].public_ip_address }}"
          aap_private_ip: "{{ aap_instance.instances[0].private_ip_address }}"
        dest: "{{ playbook_dir }}/vars/aws_resources.yml"

- name: Configure AAP Controller instance
  hosts: aap
  become: true

  vars_files:
    - vars/aws.yml
    - ../inventory/group_vars/all.yml
    - ../inventory/group_vars/aap.yml
    - ../credentials.yml

  roles:
    - role: aap_bootstrap
