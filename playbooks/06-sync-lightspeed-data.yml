---
# Phase 6: Sync CVE vulnerability data to disconnected Satellite
# Transfers cvemap.xml from the connected Satellite (where it auto-populates)
# to the disconnected Satellite for the IOP Vulnerability service.
# Run this playbook periodically (e.g. weekly via AAP schedule) to keep
# CVE data current on the disconnected Satellite.

# --- Play 1: Build in-memory inventory ---
- name: Set up host inventory for cvemap sync
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/aws.yml
    - vars/satellite_resources.yml
    - vars/disconnected_satellite_resources.yml
    - ../inventory/group_vars/all.yml
    - ../credentials.yml

  tasks:
    - name: Add connected Satellite to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ satellite_public_ip }}"
        groups: satellite
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "~/.ssh/{{ aws_key_name }}.pem"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

    - name: Ensure disconnected Satellite in SSH config
      ansible.builtin.blockinfile:
        path: "{{ playbook_dir }}/.ssh_config_disconnected"
        marker: "# {mark} MANAGED BLOCK {{ disconnected_satellite_private_ip }}"
        block: |
          Host {{ disconnected_satellite_private_ip }}
            User ec2-user
            IdentityFile ~/.ssh/{{ aws_key_name }}.pem
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand ssh -i ~/.ssh/{{ aws_key_name }}.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ec2-user@{{ satellite_public_ip }}
        create: true
        mode: "0600"

    - name: Add disconnected Satellite to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ disconnected_satellite_private_ip }}"
        groups: disconnected_satellite
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "~/.ssh/{{ aws_key_name }}.pem"
        ansible_ssh_common_args: "-F {{ playbook_dir }}/.ssh_config_disconnected -o ControlMaster=no"

# --- Play 2: Fetch cvemap from connected Satellite ---
- name: Fetch cvemap.xml from connected Satellite
  hosts: satellite
  become: true

  tasks:
    - name: Check cvemap.xml exists on connected Satellite
      ansible.builtin.stat:
        path: /var/lib/foreman/cvemap.xml
      register: cvemap_stat

    - name: Fail if cvemap.xml not yet populated
      ansible.builtin.fail:
        msg: >
          cvemap.xml is not yet available on the connected Satellite.
          Ensure IOP data has been downloaded or wait for automatic population.
      when: not cvemap_stat.stat.exists

    - name: Fetch cvemap.xml to controller
      ansible.builtin.fetch:
        src: /var/lib/foreman/cvemap.xml
        dest: /tmp/cvemap.xml
        flat: true

# --- Play 3: Push cvemap to disconnected Satellite ---
- name: Push cvemap.xml to disconnected Satellite
  hosts: disconnected_satellite
  become: true
  gather_facts: false

  vars_files:
    - vars/aws.yml
    - vars/satellite_resources.yml
    - vars/disconnected_satellite_resources.yml
    - ../inventory/group_vars/all.yml
    - ../inventory/group_vars/disconnected_satellite.yml
    - ../credentials.yml

  tasks:
    - name: Copy cvemap.xml to disconnected Satellite
      ansible.builtin.copy:
        src: /tmp/cvemap.xml
        dest: /var/lib/foreman/cvemap.xml
        owner: foreman
        group: foreman
        mode: "0644"
      register: cvemap_copy

    - name: Trigger Vulnerability data refresh
      ansible.builtin.uri:
        url: "https://{{ disconnected_satellite_hostname }}/api/iop/v1/vulnerability/refresh"
        method: POST
        user: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code:
          - 200
          - 202
          - 204
      when: cvemap_copy.changed
      ignore_errors: true

    - name: Report sync status
      ansible.builtin.debug:
        msg: >
          cvemap.xml synced to disconnected Satellite.
          Vulnerability data will be refreshed shortly.
