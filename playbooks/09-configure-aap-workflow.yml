---
# Phase 9: Configure AAP Workflow Template for Patching Cadence
# Requires: 07-deploy-aap.yml (creates aap_resources.yml with aap_private_ip)
#
# This playbook configures AAP with the job templates and workflow
# needed for the Dev -> QA -> Prod patching lifecycle.
#
# AAP has no public IP. Before running this phase, open an SSH tunnel:
#   ssh -f -N -L 8443:<aap_private_ip>:443 \
#     -i ~/.ssh/patching-poc.pem -o StrictHostKeyChecking=no \
#     -o UserKnownHostsFile=/dev/null ec2-user@<satellite_public_ip>
# Then set aap_tunnel_url to https://localhost:8443 below (or via extra-vars).
#
# AAP 2.7 uses:
#   - ansible.platform for Gateway resources (organizations, RBAC)
#   - ansible.controller for Controller resources (credentials, templates, workflows)
- name: Configure AAP Patching Workflow
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/aws.yml
    - vars/aws_resources.yml
    - vars/satellite_resources.yml
    - vars/disconnected_satellite_resources.yml
    - vars/aap_resources.yml
    - ../inventory/group_vars/all.yml
    - ../inventory/group_vars/disconnected_satellite.yml
    - ../credentials.yml

  vars:
    aap_gw_url: "{{ aap_tunnel_url | default('https://localhost:8443') }}"
    gitea_url: "http://{{ disconnected_satellite_hostname }}:3000"
    gitea_repo_url: "{{ gitea_url }}/patching-poc/patching-poc-playbooks.git"

  module_defaults:
    group/ansible.platform.gateway:
      aap_hostname: "{{ aap_gw_url }}"
      aap_username: "{{ aap_admin_user }}"
      aap_password: "{{ aap_admin_password }}"
      aap_validate_certs: false
    group/ansible.controller.controller:
      controller_host: "{{ aap_gw_url }}"
      controller_username: "{{ aap_admin_user }}"
      controller_password: "{{ aap_admin_password }}"
      validate_certs: false

  tasks:
    # --- Gateway-level resources (ansible.platform) ---
    - name: Create Patching POC organization in AAP
      ansible.platform.organization:
        name: "Patching-POC"
        state: present

    # --- Controller resources (ansible.controller) ---
    - name: Create Satellite credential type
      ansible.controller.credential_type:
        name: "Satellite Credentials"
        kind: cloud
        inputs:
          fields:
            - id: satellite_url
              type: string
              label: Satellite URL
            - id: satellite_username
              type: string
              label: Username
            - id: satellite_password
              type: string
              label: Password
              secret: true
          required:
            - satellite_url
            - satellite_username
            - satellite_password
        injectors:
          extra_vars:
            satellite_server_url: "{% raw %}{{ satellite_url }}{% endraw %}"
            satellite_username: "{% raw %}{{ satellite_username }}{% endraw %}"
            satellite_password: "{% raw %}{{ satellite_password }}{% endraw %}"
        state: present

    - name: Create Satellite credential
      ansible.controller.credential:
        name: "Satellite 6.19"
        organization: "Patching-POC"
        credential_type: "Satellite Credentials"
        inputs:
          satellite_url: "https://{{ disconnected_satellite_hostname }}"
          satellite_username: "{{ disconnected_satellite_admin_user }}"
          satellite_password: "{{ disconnected_satellite_admin_password }}"
        state: present

    - name: Create Machine credential for managed hosts
      ansible.controller.credential:
        name: "Patching POC SSH Key"
        organization: "Patching-POC"
        credential_type: "Machine"
        inputs:
          username: ec2-user
          ssh_key_data: "{{ lookup('file', '~/.ssh/' + aws_key_name + '.pem') }}"
          become_method: sudo
        state: present

    - name: Push playbooks to Gitea on disconnected Satellite
      ansible.builtin.shell: |
        set -e
        WORK=$(mktemp -d)
        cp -r {{ playbook_dir }}/../playbooks {{ playbook_dir }}/../roles {{ playbook_dir }}/../inventory "$WORK/"
        cd "$WORK"
        git init -b main
        git config user.email "admin@patching-poc.internal"
        git config user.name "Patching POC"
        git add -A
        git commit -m "Playbook sync $(date +%Y%m%d-%H%M%S)"
        git remote add origin http://gitea-admin:{{ satellite_admin_password | urlencode }}@localhost:3000/patching-poc/patching-poc-playbooks.git
        git push -f origin main
        rm -rf "$WORK"
      delegate_to: "{{ disconnected_satellite_private_ip }}"
      delegate_facts: false
      vars:
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "~/.ssh/patching-poc.pem"
        ansible_ssh_common_args: "-F {{ playbook_dir }}/.ssh_config_disconnected -o ControlMaster=no"
      changed_when: true

    - name: Create project from Gitea repository
      ansible.controller.project:
        name: "Patching POC Playbooks"
        organization: "Patching-POC"
        scm_type: git
        scm_url: "{{ gitea_repo_url }}"
        scm_branch: main
        scm_update_on_launch: true
        state: present

    - name: Create dynamic inventory from Satellite
      ansible.controller.inventory:
        name: "Satellite Managed Hosts"
        organization: "Patching-POC"
        state: present

    - name: Create inventory source from Satellite
      ansible.controller.inventory_source:
        name: "Satellite 6.19"
        inventory: "Satellite Managed Hosts"
        organization: "Patching-POC"
        source: satellite6
        credential: "Satellite 6.19"
        source_vars:
          group_prefix: "satellite_"
          keyed_groups:
            - key: foreman.lifecycle_environment_name
              prefix: lce
              separator: "_"
            - key: foreman.content_view_name
              prefix: cv
              separator: "_"
        update_on_launch: true
        overwrite: true
        state: present

    - name: Create Job Template - Publish Content View
      ansible.controller.job_template:
        name: "Patch - Publish Content View"
        organization: "Patching-POC"
        project: "Patching POC Playbooks"
        playbook: "playbooks/patch-publish-cv.yml"
        inventory: "Satellite Managed Hosts"
        credentials:
          - "Satellite 6.19"
        extra_vars:
          content_view_name: RHEL10
          satellite_organization: Patching-POC
        state: present

    - name: Create Job Template - Promote to Dev
      ansible.controller.job_template:
        name: "Patch - Promote to Dev"
        organization: "Patching-POC"
        project: "Patching POC Playbooks"
        playbook: "playbooks/patch-promote.yml"
        inventory: "Satellite Managed Hosts"
        credentials:
          - "Satellite 6.19"
        extra_vars:
          target_environment: Dev
          content_view_name: RHEL10
          satellite_organization: Patching-POC
        state: present

    - name: Create Job Template - Promote to QA
      ansible.controller.job_template:
        name: "Patch - Promote to QA"
        organization: "Patching-POC"
        project: "Patching POC Playbooks"
        playbook: "playbooks/patch-promote.yml"
        inventory: "Satellite Managed Hosts"
        credentials:
          - "Satellite 6.19"
        extra_vars:
          target_environment: QA
          content_view_name: RHEL10
          satellite_organization: Patching-POC
        state: present

    - name: Create Job Template - Promote to Prod
      ansible.controller.job_template:
        name: "Patch - Promote to Prod"
        organization: "Patching-POC"
        project: "Patching POC Playbooks"
        playbook: "playbooks/patch-promote.yml"
        inventory: "Satellite Managed Hosts"
        credentials:
          - "Satellite 6.19"
        extra_vars:
          target_environment: Prod
          content_view_name: RHEL10
          satellite_organization: Patching-POC
        state: present

    - name: Create Job Template - Apply Patches (Dev)
      ansible.controller.job_template:
        name: "Patch - Apply Errata (Dev)"
        organization: "Patching-POC"
        project: "Patching POC Playbooks"
        playbook: "playbooks/patch-apply.yml"
        inventory: "Satellite Managed Hosts"
        limit: "lce_Dev"
        credentials:
          - "Patching POC SSH Key"
          - "Satellite 6.19"
        state: present

    - name: Create Job Template - Apply Patches (QA)
      ansible.controller.job_template:
        name: "Patch - Apply Errata (QA)"
        organization: "Patching-POC"
        project: "Patching POC Playbooks"
        playbook: "playbooks/patch-apply.yml"
        inventory: "Satellite Managed Hosts"
        limit: "lce_QA"
        credentials:
          - "Patching POC SSH Key"
          - "Satellite 6.19"
        state: present

    - name: Create Job Template - Apply Patches (Prod)
      ansible.controller.job_template:
        name: "Patch - Apply Errata (Prod)"
        organization: "Patching-POC"
        project: "Patching POC Playbooks"
        playbook: "playbooks/patch-apply.yml"
        inventory: "Satellite Managed Hosts"
        limit: "lce_Prod"
        credentials:
          - "Patching POC SSH Key"
          - "Satellite 6.19"
        state: present

    - name: Create Job Template - Validate Hosts
      ansible.controller.job_template:
        name: "Patch - Validate Hosts"
        organization: "Patching-POC"
        project: "Patching POC Playbooks"
        playbook: "playbooks/patch-validate.yml"
        inventory: "Satellite Managed Hosts"
        credentials:
          - "Patching POC SSH Key"
        state: present

    - name: Create Patching Workflow Template
      ansible.controller.workflow_job_template:
        name: "RHEL 10 Patching Cadence"
        organization: "Patching-POC"
        inventory: "Satellite Managed Hosts"
        survey_enabled: false
        schema:
          - identifier: publish_cv
            unified_job_template:
              name: "Patch - Publish Content View"
              organization:
                name: "Patching-POC"
              type: job_template
            related:
              success_nodes:
                - identifier: promote_dev
          - identifier: promote_dev
            unified_job_template:
              name: "Patch - Promote to Dev"
              organization:
                name: "Patching-POC"
              type: job_template
            related:
              success_nodes:
                - identifier: apply_dev
          - identifier: apply_dev
            unified_job_template:
              name: "Patch - Apply Errata (Dev)"
              organization:
                name: "Patching-POC"
              type: job_template
            related:
              success_nodes:
                - identifier: validate_dev
          - identifier: validate_dev
            unified_job_template:
              name: "Patch - Validate Hosts"
              organization:
                name: "Patching-POC"
              type: job_template
            related:
              success_nodes:
                - identifier: approve_qa
          - identifier: approve_qa
            approval_node:
              name: "Approve QA Promotion"
              description: "Approve promotion of patches from Dev to QA"
              timeout: 0
            related:
              success_nodes:
                - identifier: promote_qa
          - identifier: promote_qa
            unified_job_template:
              name: "Patch - Promote to QA"
              organization:
                name: "Patching-POC"
              type: job_template
            related:
              success_nodes:
                - identifier: apply_qa
          - identifier: apply_qa
            unified_job_template:
              name: "Patch - Apply Errata (QA)"
              organization:
                name: "Patching-POC"
              type: job_template
            related:
              success_nodes:
                - identifier: validate_qa
          - identifier: validate_qa
            unified_job_template:
              name: "Patch - Validate Hosts"
              organization:
                name: "Patching-POC"
              type: job_template
            related:
              success_nodes:
                - identifier: approve_prod
          - identifier: approve_prod
            approval_node:
              name: "Approve Prod Promotion"
              description: "Approve promotion of patches from QA to Prod"
              timeout: 0
            related:
              success_nodes:
                - identifier: promote_prod
          - identifier: promote_prod
            unified_job_template:
              name: "Patch - Promote to Prod"
              organization:
                name: "Patching-POC"
              type: job_template
            related:
              success_nodes:
                - identifier: apply_prod
          - identifier: apply_prod
            unified_job_template:
              name: "Patch - Apply Errata (Prod)"
              organization:
                name: "Patching-POC"
              type: job_template
            related:
              success_nodes:
                - identifier: validate_prod
          - identifier: validate_prod
            unified_job_template:
              name: "Patch - Validate Hosts"
              organization:
                name: "Patching-POC"
              type: job_template
        state: present

    - name: Create schedule for weekly Dev/QA patching
      ansible.controller.schedule:
        name: "Weekly Patch Cycle (Dev/QA)"
        unified_job_template: "RHEL 10 Patching Cadence"
        rrule: "DTSTART:20260901T060000Z RRULE:FREQ=WEEKLY;BYDAY=TU"
        state: present
