---
# Phase 5: Configure RHEL10 content management on the disconnected Satellite
# Requires: 04-deploy-disconnected-satellite.yml (ISS sync complete, repos available)
#
# Creates Lifecycle Environments (Dev / QA / Prod), the RHEL10 Content View
# with errata and RPM filters, publishes and promotes CV versions through
# the LCEs, and creates activation keys and host groups.
#
# The disconnected Satellite has no public IP. An SSH tunnel is opened
# through the connected Satellite so the redhat.satellite modules can
# reach the API from localhost.
- name: Configure RHEL10 content on disconnected Satellite
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/aws.yml
    - vars/satellite_resources.yml
    - vars/disconnected_satellite_resources.yml
    - vars/disconnected_content.yml
    - ../inventory/group_vars/all.yml
    - ../inventory/group_vars/disconnected_satellite.yml
    - ../credentials.yml

  vars:
    tunnel_local_port: 14443
    disconnected_sat_api: "https://localhost:{{ tunnel_local_port }}"

  tasks:
    - name: Kill any stale SSH tunnel on port {{ tunnel_local_port }}
      ansible.builtin.shell:
        cmd: "kill $(lsof -ti tcp:{{ tunnel_local_port }}) 2>/dev/null || true"
      changed_when: false

    - name: Wait for port to be released
      ansible.builtin.wait_for:
        host: localhost
        port: "{{ tunnel_local_port }}"
        state: stopped
        timeout: 10
      ignore_errors: true

    - name: Open SSH tunnel to disconnected Satellite API
      ansible.builtin.shell:
        cmd: >
          ssh -f -N
          -L {{ tunnel_local_port }}:{{ disconnected_satellite_private_ip }}:443
          -i ~/.ssh/{{ aws_key_name }}.pem
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          ec2-user@{{ satellite_public_ip }}
      changed_when: true

    - name: Wait for tunnel to be ready
      ansible.builtin.wait_for:
        host: localhost
        port: "{{ tunnel_local_port }}"
        delay: 2
        timeout: 15

    # --- Lifecycle Environments ---
    - name: Create Lifecycle Environments on disconnected Satellite
      redhat.satellite.lifecycle_environment:
        server_url: "{{ disconnected_sat_api }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        name: "{{ item.name }}"
        prior: "{{ item.prior }}"
        description: "{{ item.description }}"
        organization: "{{ disconnected_satellite_organization }}"
        state: present
      loop: "{{ satellite_lifecycle_environments }}"

    # --- Content View ---
    - name: Create RHEL10 Content View
      redhat.satellite.content_view:
        server_url: "{{ disconnected_sat_api }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        name: "{{ satellite_content_view_name }}"
        organization: "{{ disconnected_satellite_organization }}"
        repositories: "{{ satellite_content_view_repos }}"
        state: present

    - name: Create RPM inclusion filter
      redhat.satellite.content_view_filter:
        server_url: "{{ disconnected_sat_api }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        content_view: "{{ satellite_content_view_name }}"
        organization: "{{ disconnected_satellite_organization }}"
        name: "{{ satellite_cv_rpm_filter_name }}"
        filter_type: rpm
        inclusion: true
        original_packages: true
        state: present

    - name: Create erratum-by-date inclusion filter
      redhat.satellite.content_view_filter:
        server_url: "{{ disconnected_sat_api }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        content_view: "{{ satellite_content_view_name }}"
        organization: "{{ disconnected_satellite_organization }}"
        name: "{{ satellite_cv_filter_name }}"
        filter_type: erratum
        inclusion: true
        state: present

    # --- Publish and promote CV versions through LCEs ---
    - name: Publish and promote content view versions
      ansible.builtin.include_tasks: tasks/publish_promote_downstream.yml
      loop: "{{ satellite_cv_versions }}"
      loop_control:
        loop_var: cv_version

    # --- Activation Keys ---
    - name: Create Activation Keys
      redhat.satellite.activation_key:
        server_url: "{{ disconnected_sat_api }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        name: "{{ item.name }}"
        organization: "{{ disconnected_satellite_organization }}"
        lifecycle_environment: "{{ item.lifecycle_environment }}"
        content_view: "{{ item.content_view }}"
        release_version: "{{ item.release_version }}"
        auto_attach: "{{ item.auto_attach }}"
        state: present
      loop: "{{ satellite_activation_keys }}"

    # --- Host Groups ---
    - name: Create Host Groups
      redhat.satellite.hostgroup:
        server_url: "{{ disconnected_sat_api }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        name: "{{ item.name }}"
        organization: "{{ disconnected_satellite_organization }}"
        lifecycle_environment: "{{ item.lifecycle_environment | default(omit) }}"
        content_view: "{{ item.content_view | default(omit) }}"
        locations:
          - "{{ disconnected_satellite_location }}"
        state: present
      loop: "{{ satellite_hostgroups }}"
