---
# Phase 4: Deploy disconnected Satellite Server with IOP
# Requires: 01-provision-networking.yml, 02-deploy-satellite.yml, 03-configure-satellite.yml
# Provisions a RHEL 9 EC2 instance in the private subnet (created in phase 01),
# installs Satellite, configures ISS Network Sync from the connected upstream,
# and enables Lightspeed on-prem (Advisor + Vulnerability).

# --- Play 1: Provision disconnected Satellite EC2 ---
- name: Provision disconnected Satellite EC2 instance
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/aws.yml
    - vars/aws_resources.yml
    - vars/satellite_resources.yml
    - ../inventory/group_vars/all.yml
    - ../inventory/group_vars/satellite.yml
    - ../inventory/group_vars/disconnected_satellite.yml
    - ../credentials.yml

  tasks:
    - name: Create disconnected Satellite security group
      amazon.aws.ec2_security_group:
        name: patching-poc-disconnected-satellite-sg
        description: Security group for disconnected Satellite Server
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        rules: "{{ disconnected_satellite_security_group_rules }}"
        rules_egress:
          - proto: all
            cidr_ip: "{{ aws_vpc_cidr }}"
            rule_desc: Allow all traffic within VPC
        tags: "{{ aws_tags }}"
        state: present
      register: dsat_sg

    - name: Find latest RHEL 9 AMI for disconnected Satellite
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners:
          - "{{ disconnected_satellite_ami_owner }}"
        filters:
          name: "{{ disconnected_satellite_ami_filter }}"
          architecture: x86_64
      register: dsat_amis

    - name: Set latest RHEL 9 AMI fact
      ansible.builtin.set_fact:
        dsat_ami_id: "{{ (dsat_amis.images | sort(attribute='creation_date') | last).image_id }}"

    - name: Launch disconnected Satellite EC2 instance
      amazon.aws.ec2_instance:
        name: patching-poc-disconnected-satellite
        key_name: "{{ aws_key_name }}"
        instance_type: "{{ disconnected_satellite_instance_type }}"
        image_id: "{{ dsat_ami_id }}"
        region: "{{ aws_region }}"
        vpc_subnet_id: "{{ disconnected_subnet_id }}"
        security_group: "{{ dsat_sg.group_id }}"
        network:
          assign_public_ip: false
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: "{{ disconnected_satellite_root_volume_size }}"
              volume_type: gp3
              delete_on_termination: true
          - device_name: /dev/sdb
            ebs:
              volume_size: "{{ disconnected_satellite_data_volume_size }}"
              volume_type: gp3
              delete_on_termination: true
        tags: "{{ aws_tags | combine({'Name': 'patching-poc-disconnected-satellite', 'Role': 'disconnected_satellite', 'Environment': 'management'}) }}"
        wait: true
        state: running
      register: dsat_instance

    - name: Save disconnected Satellite instance details
      ansible.builtin.copy:
        content: |
          ---
          disconnected_satellite_instance_id: "{{ dsat_instance.instances[0].instance_id }}"
          disconnected_satellite_private_ip: "{{ dsat_instance.instances[0].private_ip_address }}"
        dest: "{{ playbook_dir }}/vars/disconnected_satellite_resources.yml"

    - name: Ensure SSH config file exists for disconnected subnet
      ansible.builtin.copy:
        content: "# Managed by Patching-POC playbooks\n"
        dest: "{{ playbook_dir }}/.ssh_config_disconnected"
        mode: "0600"
        force: false

    - name: Add disconnected Satellite to SSH config
      ansible.builtin.blockinfile:
        path: "{{ playbook_dir }}/.ssh_config_disconnected"
        marker: "# {mark} MANAGED BLOCK {{ dsat_instance.instances[0].private_ip_address }}"
        block: |
          Host {{ dsat_instance.instances[0].private_ip_address }}
            User ec2-user
            IdentityFile ~/.ssh/{{ aws_key_name }}.pem
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand ssh -i ~/.ssh/{{ aws_key_name }}.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ec2-user@{{ satellite_public_ip }}
        create: true
        mode: "0600"

    - name: Add disconnected Satellite to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ dsat_instance.instances[0].private_ip_address }}"
        groups: disconnected_satellite
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "~/.ssh/{{ aws_key_name }}.pem"
        ansible_ssh_common_args: "-F {{ playbook_dir }}/.ssh_config_disconnected -o ControlMaster=no"

    - name: Add upstream Satellite to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ satellite_public_ip }}"
        groups: satellite
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "~/.ssh/{{ aws_key_name }}.pem"

# --- Play 2: Install disconnected Satellite ---
- name: Install disconnected Satellite Server
  hosts: disconnected_satellite
  become: true
  gather_facts: false

  vars_files:
    - vars/aws.yml
    - vars/satellite_resources.yml
    - vars/disconnected_satellite_resources.yml
    - ../inventory/group_vars/all.yml
    - ../inventory/group_vars/satellite.yml
    - ../inventory/group_vars/disconnected_satellite.yml
    - ../credentials.yml

  pre_tasks:
    - name: Wait for SSH on disconnected Satellite via bastion
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - role: satellite_disconnected_deploy

# --- Play 3: Configure ISS Network Sync and content on downstream ---
- name: Configure ISS and content on disconnected Satellite
  hosts: disconnected_satellite
  become: true

  vars_files:
    - vars/aws.yml
    - vars/satellite_resources.yml
    - vars/disconnected_satellite_resources.yml
    - ../inventory/group_vars/all.yml
    - ../inventory/group_vars/satellite.yml
    - ../inventory/group_vars/disconnected_satellite.yml
    - ../credentials.yml

  tasks:
    - name: Fetch upstream Satellite CA certificate
      ansible.builtin.command:
        cmd: >
          curl -sk https://{{ satellite_private_ip }}/pub/katello-server-ca.crt
      register: upstream_ca_cert
      changed_when: false

    - name: Save upstream CA cert to file
      ansible.builtin.copy:
        content: "{{ upstream_ca_cert.stdout }}"
        dest: /root/upstream-satellite-ca.pem
        mode: "0644"

    - name: Import upstream CA as content credential via hammer
      ansible.builtin.command:
        cmd: >
          hammer content-credential create
          --name "Upstream Satellite CA"
          --organization "{{ disconnected_satellite_organization }}"
          --content-type cert
          --path /root/upstream-satellite-ca.pem
      register: ca_create
      changed_when: true
      failed_when:
        - ca_create.rc != 0
        - "'already been taken' not in ca_create.stderr"

    - name: Get upstream CA content credential ID
      ansible.builtin.command:
        cmd: >
          hammer content-credential info
          --name "Upstream Satellite CA"
          --organization "{{ disconnected_satellite_organization }}"
      register: ca_info
      changed_when: false

    - name: Extract CA credential ID
      ansible.builtin.set_fact:
        upstream_ca_id: "{{ ca_info.stdout | regex_search('Id:\\s+(\\d+)', '\\1') | first }}"

    - name: Configure CDN to use ISS Network Sync from upstream Satellite
      ansible.builtin.command:
        cmd: >
          hammer organization configure-cdn
          --name "{{ disconnected_satellite_organization }}"
          --type network_sync
          --url "https://{{ satellite_hostname }}"
          --username "{{ satellite_admin_user }}"
          --password "{{ satellite_admin_password }}"
          --ssl-ca-credential-id "{{ upstream_ca_id }}"
          --upstream-organization-label "{{ disconnected_satellite_organization }}"
      changed_when: true

    - name: Enable RHEL 10 BaseOS repository on downstream
      redhat.satellite.repository_set:
        server_url: "https://{{ disconnected_satellite_hostname }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        name: "Red Hat Enterprise Linux 10 for x86_64 - BaseOS (RPMs)"
        organization: "{{ disconnected_satellite_organization }}"
        product: "Red Hat Enterprise Linux for x86_64"
        repositories:
          - releasever: "10"
        state: enabled

    - name: Enable RHEL 10 AppStream repository on downstream
      redhat.satellite.repository_set:
        server_url: "https://{{ disconnected_satellite_hostname }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        name: "Red Hat Enterprise Linux 10 for x86_64 - AppStream (RPMs)"
        organization: "{{ disconnected_satellite_organization }}"
        product: "Red Hat Enterprise Linux for x86_64"
        repositories:
          - releasever: "10"
        state: enabled

    - name: Set download policy to on_demand for BaseOS on downstream
      redhat.satellite.repository:
        server_url: "https://{{ disconnected_satellite_hostname }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        name: "Red Hat Enterprise Linux 10 for x86_64 - BaseOS RPMs 10"
        product: "Red Hat Enterprise Linux for x86_64"
        organization: "{{ disconnected_satellite_organization }}"
        download_policy: on_demand
        content_type: yum
        state: present

    - name: Set download policy to on_demand for AppStream on downstream
      redhat.satellite.repository:
        server_url: "https://{{ disconnected_satellite_hostname }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        name: "Red Hat Enterprise Linux 10 for x86_64 - AppStream RPMs 10"
        product: "Red Hat Enterprise Linux for x86_64"
        organization: "{{ disconnected_satellite_organization }}"
        download_policy: on_demand
        content_type: yum
        state: present

    - name: Enable AAP 2.7 repository on downstream via ISS
      redhat.satellite.repository_set:
        server_url: "https://{{ disconnected_satellite_hostname }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        name: "Red Hat Ansible Automation Platform 2.7 for RHEL 10 x86_64 (RPMs)"
        organization: "{{ disconnected_satellite_organization }}"
        product: "Red Hat Ansible Automation Platform"
        all_repositories: true
        state: enabled

    - name: Set download policy to on_demand for AAP repo on downstream
      redhat.satellite.repository:
        server_url: "https://{{ disconnected_satellite_hostname }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        name: "Red Hat Ansible Automation Platform 2.7 for RHEL 10 x86_64 RPMs"
        product: "Red Hat Ansible Automation Platform"
        organization: "{{ disconnected_satellite_organization }}"
        download_policy: on_demand
        content_type: yum
        state: present

    - name: Sync AAP 2.7 repository from upstream
      redhat.satellite.repository_sync:
        server_url: "https://{{ disconnected_satellite_hostname }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        product: "Red Hat Ansible Automation Platform"
        organization: "{{ disconnected_satellite_organization }}"
      async: 7200
      poll: 60

    - name: Sync RHEL 10 repositories from upstream
      redhat.satellite.repository_sync:
        server_url: "https://{{ disconnected_satellite_hostname }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        product: "Red Hat Enterprise Linux for x86_64"
        organization: "{{ disconnected_satellite_organization }}"
      async: 7200
      poll: 60

    - name: Create AAP activation key on downstream
      redhat.satellite.activation_key:
        server_url: "https://{{ disconnected_satellite_hostname }}"
        username: "{{ disconnected_satellite_admin_user }}"
        password: "{{ disconnected_satellite_admin_password }}"
        validate_certs: false
        name: "ak-aap"
        organization: "{{ disconnected_satellite_organization }}"
        lifecycle_environment: "Library"
        content_view: "Default Organization View"
        release_version: "10"
        auto_attach: true
        content_overrides:
          - label: ansible-automation-platform-2.7-for-rhel-10-x86_64-rpms
            override: enabled
        state: present

# --- Play 4: Enable IOP on disconnected Satellite ---
- name: Export IOP container images from connected Satellite
  hosts: satellite
  become: true

  vars_files:
    - vars/aws.yml
    - vars/satellite_resources.yml
    - vars/disconnected_satellite_resources.yml
    - ../inventory/group_vars/all.yml
    - ../credentials.yml

  vars:
    iop_images:
      - registry.redhat.io/satellite/iop-ingress-rhel9:6.19
      - registry.redhat.io/satellite/iop-advisor-frontend-rhel9:6.19
      - registry.redhat.io/satellite/iop-advisor-backend-rhel9:6.19
      - registry.redhat.io/satellite/iop-host-inventory-rhel9:6.19
      - registry.redhat.io/satellite/iop-host-inventory-frontend-rhel9:6.19
      - registry.redhat.io/satellite/iop-vmaas-rhel9:6.19
      - registry.redhat.io/satellite/iop-yuptoo-rhel9:6.19
      - registry.redhat.io/satellite/iop-puptoo-rhel9:6.19
      - registry.redhat.io/satellite/iop-insights-engine-rhel9:6.19
      - registry.redhat.io/satellite/iop-vulnerability-engine-rhel9:6.19
      - registry.redhat.io/satellite/iop-vulnerability-frontend-rhel9:6.19
      - registry.redhat.io/satellite/iop-gateway-rhel9:6.19
      - registry.redhat.io/satellite/iop-remediations-rhel9:6.19
      - registry.redhat.io/amq-streams/kafka-39-rhel9:2.9.1-1

  tasks:
    - name: Log in to registry.redhat.io on connected Satellite
      containers.podman.podman_login:
        registry: registry.redhat.io
        username: "{{ registry_username }}"
        password: "{{ registry_password }}"

    - name: Pull IOP container images on connected Satellite
      containers.podman.podman_image:
        name: "{{ item }}"
        state: present
      loop: "{{ iop_images }}"
      register: iop_pull_results
      ignore_errors: true

    - name: Report any failed IOP image pulls
      ansible.builtin.debug:
        msg: "WARNING: Could not pull {{ item.item }} — image may not exist for this Satellite version"
      loop: "{{ iop_pull_results.results | selectattr('failed', 'defined') | selectattr('failed') | list }}"
      when: iop_pull_results.results | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0

    - name: Get list of successfully pulled IOP images
      ansible.builtin.shell:
        cmd: "podman images --format '{{'{{'}}.Repository{{'}}'}}:{{'{{'}}.Tag{{'}}'}}' | grep -E '(iop|kafka)'"
      register: pulled_images
      changed_when: false

    - name: Save IOP container images to archive
      ansible.builtin.command:
        cmd: "podman save -m -o /root/iop-images.tar {{ pulled_images.stdout_lines | join(' ') }}"
        creates: /root/iop-images.tar
      when: pulled_images.stdout_lines | length > 0

    - name: Copy IOP images archive to Satellite pub directory
      ansible.builtin.copy:
        src: /root/iop-images.tar
        dest: /var/www/html/pub/iop-images.tar
        mode: "0644"
        remote_src: true

- name: Load IOP images and enable on disconnected Satellite
  hosts: disconnected_satellite
  become: true

  vars_files:
    - vars/aws.yml
    - vars/satellite_resources.yml
    - vars/disconnected_satellite_resources.yml
    - ../inventory/group_vars/all.yml
    - ../inventory/group_vars/disconnected_satellite.yml
    - ../credentials.yml

  tasks:
    - name: Download IOP images from connected Satellite
      ansible.builtin.get_url:
        url: "https://{{ satellite_private_ip }}/pub/iop-images.tar"
        dest: /tmp/iop-images.tar
        validate_certs: false
        mode: "0644"
        timeout: 600

    - name: Load IOP container images
      ansible.builtin.command:
        cmd: podman load -i /tmp/iop-images.tar
      changed_when: true

    - name: Enable IOP via satellite-installer
      ansible.builtin.include_role:
        name: redhat.satellite_operations.installer
      vars:
        satellite_installer_scenario: satellite
        satellite_installer_options:
          - '--enable-iop'

    - name: Wait for IOP containers to start
      ansible.builtin.command:
        cmd: podman ps --filter name=iop --format "{{ '{{' }}.Names{{ '}}' }}"
      register: iop_containers
      retries: 30
      delay: 30
      until: iop_containers.stdout_lines | length >= 15
      changed_when: false

    - name: Display running IOP containers
      ansible.builtin.debug:
        msg: "Running IOP containers ({{ iop_containers.stdout_lines | length }}): {{ iop_containers.stdout_lines }}"

    - name: Clean up IOP images archive
      ansible.builtin.file:
        path: /root/iop-images.tar
        state: absent

# --- Play 6: Download Gitea binary on localhost (has internet) ---
- name: Download Gitea binary
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    gitea_version: "1.23.7"

  tasks:
    - name: Download Gitea binary to localhost
      ansible.builtin.get_url:
        url: "https://dl.gitea.com/gitea/{{ gitea_version }}/gitea-{{ gitea_version }}-linux-amd64"
        dest: /tmp/gitea
        mode: "0755"

# --- Play 7: Install Gitea on disconnected Satellite ---
- name: Install Gitea on disconnected Satellite
  hosts: disconnected_satellite
  become: true

  vars_files:
    - vars/aws.yml
    - vars/satellite_resources.yml
    - vars/disconnected_satellite_resources.yml
    - ../inventory/group_vars/all.yml
    - ../inventory/group_vars/disconnected_satellite.yml
    - ../credentials.yml

  vars:
    gitea_admin_user: gitea-admin
    gitea_admin_password: "{{ satellite_admin_password }}"
    gitea_admin_email: admin@patching-poc.internal
    gitea_http_port: 3000
    gitea_org_name: patching-poc

  tasks:
    - name: Create git system user
      ansible.builtin.user:
        name: git
        system: true
        shell: /bin/bash
        home: /home/git
        create_home: true

    - name: Create Gitea directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /var/lib/gitea, owner: git, group: git, mode: "0750" }
        - { path: /var/lib/gitea/custom, owner: git, group: git, mode: "0750" }
        - { path: /var/lib/gitea/data, owner: git, group: git, mode: "0750" }
        - { path: /var/lib/gitea/log, owner: git, group: git, mode: "0750" }
        - { path: /etc/gitea, owner: root, group: git, mode: "0770" }

    - name: Copy Gitea binary to disconnected Satellite
      ansible.builtin.copy:
        src: /tmp/gitea
        dest: /usr/local/bin/gitea
        owner: root
        group: root
        mode: "0755"

    - name: Set SELinux context for Gitea binary
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - semanage fcontext -a -t bin_t '/usr/local/bin/gitea'
        - restorecon -v /usr/local/bin/gitea
      changed_when: true
      failed_when: false

    - name: Set SELinux context for Gitea data
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - semanage fcontext -a -t var_lib_t '/var/lib/gitea(/.*)?'
        - restorecon -Rv /var/lib/gitea
      changed_when: true
      failed_when: false

    - name: Template Gitea configuration
      ansible.builtin.copy:
        content: |
          APP_NAME = Patching POC Git Server
          RUN_USER = git
          RUN_MODE = prod
          WORK_PATH = /var/lib/gitea

          [server]
          HTTP_PORT = {{ gitea_http_port }}
          ROOT_URL = http://{{ disconnected_satellite_hostname }}:{{ gitea_http_port }}/
          DOMAIN = {{ disconnected_satellite_hostname }}
          SSH_DOMAIN = {{ disconnected_satellite_hostname }}
          DISABLE_SSH = true
          OFFLINE_MODE = true

          [database]
          DB_TYPE = sqlite3
          PATH = /var/lib/gitea/data/gitea.db

          [service]
          DISABLE_REGISTRATION = true
          REQUIRE_SIGNIN_VIEW = false
          DEFAULT_ALLOW_CREATE_ORGANIZATION = false

          [repository]
          DEFAULT_BRANCH = main
          DEFAULT_PRIVATE = public

          [log]
          MODE = file
          LEVEL = Info
          ROOT_PATH = /var/lib/gitea/log
        dest: /etc/gitea/app.ini
        owner: root
        group: git
        mode: "0640"

    - name: Create Gitea systemd service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Gitea (Git with a cup of tea)
          After=network.target

          [Service]
          Type=simple
          User=git
          Group=git
          WorkingDirectory=/var/lib/gitea/
          ExecStart=/usr/local/bin/gitea web --config /etc/gitea/app.ini
          Restart=always
          Environment=USER=git HOME=/home/git GITEA_WORK_DIR=/var/lib/gitea

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/gitea.service
        mode: "0644"

    - name: Start and enable Gitea
      ansible.builtin.systemd:
        name: gitea
        state: started
        enabled: true
        daemon_reload: true

    - name: Open firewall port for Gitea
      ansible.posix.firewalld:
        port: "{{ gitea_http_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled

    - name: Wait for Gitea to be ready
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ gitea_http_port }}/"
        status_code: [200, 302]
      register: gitea_ready
      retries: 15
      delay: 5
      until: gitea_ready.status in [200, 302]

    - name: Check if Gitea API is available (setup completed)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ gitea_http_port }}/api/v1/settings/api"
        status_code: [200, 404]
      register: gitea_api_check

    - name: Prompt to complete Gitea setup via GUI
      ansible.builtin.fail:
        msg: |
          Gitea is running but initial setup has not been completed.
          Open an SSH tunnel and complete setup in your browser:

            ssh -f -N -L 3000:{{ disconnected_satellite_private_ip }}:3000 \
              -i ~/.ssh/patching-poc.pem -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null ec2-user@<satellite_public_ip>

          Then browse to http://localhost:3000 and complete the install wizard.
          Admin user: {{ gitea_admin_user }}
          Admin email: {{ gitea_admin_email }}

          Re-run this playbook from:
            --start-at-task="Check if Gitea API is available (setup completed)"
      when: gitea_api_check.status == 404

    - name: Create patching-poc organization in Gitea
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ gitea_http_port }}/api/v1/orgs"
        method: POST
        user: "{{ gitea_admin_user }}"
        password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          username: "{{ gitea_org_name }}"
          full_name: "Patching POC"
          visibility: public
        status_code: [201, 422]

    - name: Create playbooks repository in Gitea
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ gitea_http_port }}/api/v1/orgs/{{ gitea_org_name }}/repos"
        method: POST
        user: "{{ gitea_admin_user }}"
        password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          name: patching-poc-playbooks
          description: "AAP playbooks for RHEL 10 patching workflow"
          private: false
          auto_init: true
          default_branch: main
        status_code: [201, 409]

    - name: Display Gitea access info
      ansible.builtin.debug:
        msg: |
          Gitea is running on the disconnected Satellite:
            Internal URL: http://{{ disconnected_satellite_hostname }}:{{ gitea_http_port }}
            Admin user:   {{ gitea_admin_user }}
            Repository:   http://{{ disconnected_satellite_hostname }}:{{ gitea_http_port }}/{{ gitea_org_name }}/patching-poc-playbooks.git
          To access from desktop, open an SSH tunnel:
            ssh -f -N -L 3000:{{ disconnected_satellite_private_ip }}:3000 \
              -i ~/.ssh/patching-poc.pem -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null ec2-user@<satellite_public_ip>
            Then browse: http://localhost:3000
